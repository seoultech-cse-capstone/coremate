subject_code: OPERATING_SYSTEM
db_subject_code: OS
subject_name: 운영체제
subject_name_en: Operating Systems

taxonomy_rules:
  category_lv1_count: "5~7"
  category_lv2_per_lv1: "2~6"
  concepts_per_lv2: "3~10"

taxonomy_scope:
  scope_summary: "운영체제 과목은 컴퓨터 시스템의 자원을 관리하고, 프로세스·스레드·메모리·파일시스템·입출력·보호 기능을 제공하는 시스템 소프트웨어의 핵심 개념을 중심으로 구성한다."

  include_topics:
    - 운영체제 개요
    - 커널
    - 사용자 모드
    - 커널 모드
    - 시스템 콜
    - 인터럽트
    - 트랩
    - 프로세스
    - 프로세스 상태
    - 문맥 교환
    - 프로세스 생성
    - fork
    - exec
    - wait
    - 스레드
    - 멀티스레딩
    - CPU 스케줄링
    - 선점형 스케줄링
    - 비선점형 스케줄링
    - 라운드 로빈
    - 우선순위 스케줄링
    - 멀티레벨 피드백 큐
    - 동시성
    - 경쟁 상태
    - 임계 구역
    - 상호 배제
    - 락
    - 뮤텍스
    - 세마포어
    - 조건 변수
    - 데드락
    - 기아 상태
    - 주소 공간
    - 가상 메모리
    - 주소 변환
    - 페이징
    - 페이지 테이블
    - TLB
    - 페이지 폴트
    - 페이지 교체
    - 스와핑
    - 파일
    - 디렉터리
    - 파일 디스크립터
    - inode
    - 파일시스템
    - 버퍼 캐시
    - 저널링
    - 디스크 스케줄링
    - 입출력 장치
    - 디바이스 드라이버
    - 보호
    - 접근 제어
    - 사용자 권한
    - 프로세스 격리

  exclude_topics:
    - 버블 정렬
    - 선택 정렬
    - 삽입 정렬
    - 병합 정렬
    - 퀵 정렬
    - 힙 정렬
    - 최단 경로
    - 다익스트라 알고리즘
    - 벨만-포드 알고리즘
    - 최소 신장 트리
    - 프림 알고리즘
    - 크루스칼 알고리즘
    - 위상 정렬
    - 동적 계획법
    - 그리디 알고리즘
    - SQL
    - 정규화
    - 인덱스 설계
    - 데이터베이스 트랜잭션
    - 데이터베이스 동시성 제어
    - TCP
    - UDP
    - IP
    - 라우팅 프로토콜
    - HTTP
    - DNS
    - 소켓 프로그래밍 심화
    - 논리 게이트
    - 조합 논리 회로
    - 순차 논리 회로
    - CPU 파이프라인 상세 설계
    - 명령어 집합 구조 상세 설계
    - 캐시 하드웨어 설계
    - 어셈블리 프로그래밍
    - 컴파일러
    - 분산 시스템
    - 클라우드 컴퓨팅
    - 컨테이너
    - 쿠버네티스
    - 리눅스 명령어 사용법
    - 쉘 스크립트
    - 운영체제 설치 및 관리

  overlap_policy: "컴퓨터구조 과목에서 더 중심적으로 다루는 하드웨어 내부 설계, 네트워크 과목에서 더 중심적으로 다루는 통신 프로토콜, 데이터베이스 과목에서 더 중심적으로 다루는 트랜잭션/인덱스/SQL, 알고리즘 과목에서 더 중심적으로 다루는 알고리즘 설계 기법은 운영체제 taxonomy에 넣지 않는다."

  duplicate_policy: "같은 concept_name 또는 같은 의미의 concept는 taxonomy 전체에서 한 번만 등장시킨다."

  concept_granularity_policy: "하위 concept는 운영체제 문제 생성 기준이 될 수 있을 정도로 작아야 하지만, 단순 API 이름이나 특정 구현 세부사항 하나만 과도하게 쪼개는 것은 피한다. 개념 문제집에서 정의, 비교, 오해, 예시, 적용 문제를 만들 수 있는 단위를 우선한다."

concept_rules:
  one_line_definition: "한 문장"
  core_summary: "2~4문장"
  core_keywords: "3~5개"
  key_properties: "3~6개"

  review_status_default: draft
  is_active_default: false
  version_no_default: 1

source_policy:
  raw_pdf_storage: "전공서적 PDF 원문은 data/raw/{SUBJECT_CODE}/에만 로컬 보관하고 GitHub와 서비스 DB에는 저장하지 않는다."
  concept_generation_policy: "PDF 원문을 그대로 복사하지 않고, source_chunks를 근거로 공통 조사 템플릿에 맞게 재구성한다."
  source_refs_policy: "개념과 문제에는 출처 확인용 source_refs 메타데이터를 남긴다."
  insufficient_source_policy: "관련 source_chunks가 부족한 개념은 insufficient_source를 true로 표시하고 사람 검수 대상으로 둔다."

relation_rules:
  allowed_relation_types:
    - related
    - confusing
    - prerequisite

  prerequisite_direction: "source_concept_code는 먼저 알아야 하는 개념, target_concept_code는 이후에 배우는 개념으로 둔다."
  bidirectional_policy: "related와 confusing은 의미상 양방향 관계다. 테스트 JSON에서는 한 방향만 저장할 수 있고, DB 저장 시 양방향 row 저장 또는 조회 시 양방향 검색 방식 중 하나를 선택한다."

common_mistake_rules:
  mistakes_per_concept: "2~4"
  mistake_code_pattern: "{concept_code}_M{index}"
  correction_text_usage: "correction_text는 문제 풀이 중 물음표 힌트 원문으로 재사용한다."
  correction_text_policy: "정답을 직접 알려주기보다, 사용자가 어떤 운영체제 개념을 구분해야 하는지 방향을 잡아주는 1~2문장으로 작성한다."

  review_status_default: draft
  is_active_default: false

question_rules:
  question_format: MCQ_4
  questions_per_concept: 7

  # 개념당 만들 난이도 구성. 기존 문항의 난이도를 뺀 나머지를 그 회차에 요청한다.
  # 기존 생성분이 난이도 1~3에 몰려 있어 4~5를 명시적으로 배분한다.
  difficulty_mix:
    - 1
    - 2
    - 2
    - 3
    - 3
    - 4
    - 5

  choice_key_type: key
  answer_keys:
    - A
    - B
    - C
    - D

  difficulty_levels:
    - 1
    - 2
    - 3
    - 4
    - 5

  difficulty_source_default: ai_initial

  question_types:
    - definition
    - comparison
    - misconception
    - example
    - application

  hint_policy:
    use_hint_mistake_code: true
    hint_field_name: hint_mistake_code
    correction_snapshot_field_name: hint_correction_text_snapshot
    no_hint_value: null

  source_type_default: ai_generated
  review_status_default: draft
  is_active_default: false
  version_no_default: 1

  eligibility_defaults:
    is_daily_quiz_eligible: true
    is_mock_eligible: true
    is_concept_practice_eligible: true

  content_hash:
    enabled: true
    algorithm: sha256
    purpose: "문제 중복 생성 방지"

review_rules:
  ai_review_verdicts:
    - pass
    - revise
    - reject

  human_review_statuses:
    - draft
    - reviewed
    - approved
    - rejected
    - archived

  review_policy: "AI review는 자동 품질 점검 결과일 뿐이며, 사람이 최종 승인하기 전까지 question의 review_status는 draft로 둔다."