subject_code: NETWORK
db_subject_code: NETWORK
subject_name: 네트워크
subject_name_en: Computer Networks

taxonomy_rules:
  category_lv1_count: "5~7"
  category_lv2_per_lv1: "2~6"
  concepts_per_lv2: "3~10"

taxonomy_scope:
  scope_summary: "네트워크 과목은 컴퓨터와 시스템이 데이터를 주고받기 위한 계층 구조, 프로토콜, 주소 체계, 전송 방식, 라우팅, 응용 계층 서비스, 네트워크 보안 기초를 중심으로 구성한다."

  include_topics:
    - 컴퓨터 네트워크 개요
    - 네트워크 아키텍처
    - 프로토콜
    - 네트워크 계층 구조
    - OSI 7계층
    - TCP/IP 모델
    - 캡슐화
    - 역캡슐화
    - 패킷
    - 프레임
    - 세그먼트
    - 데이터그램
    - 지연 시간
    - 대역폭
    - 처리량
    - 지터
    - 패킷 손실
    - 애플리케이션 계층
    - HTTP
    - HTTPS
    - DNS
    - SMTP
    - FTP
    - DHCP
    - 소켓 기본
    - 전송 계층
    - TCP
    - UDP
    - 포트 번호
    - 다중화
    - 역다중화
    - TCP 3-way handshake
    - TCP 연결 종료
    - 흐름 제어
    - 혼잡 제어
    - 신뢰적 데이터 전송
    - 재전송
    - 슬라이딩 윈도우
    - 네트워크 계층
    - IP
    - IPv4
    - IPv6
    - IP 주소
    - 서브넷
    - 서브넷 마스크
    - CIDR
    - NAT
    - ICMP
    - 라우팅
    - 라우터
    - 라우팅 테이블
    - 최단 경로 라우팅
    - 거리 벡터 라우팅
    - 링크 상태 라우팅
    - RIP
    - OSPF
    - BGP
    - 데이터 링크 계층
    - MAC 주소
    - ARP
    - Ethernet
    - 스위치
    - 스위칭
    - 충돌 도메인
    - 브로드캐스트 도메인
    - 오류 검출
    - CRC
    - 무선 네트워크
    - Wi-Fi
    - 물리 계층
    - 전송 매체
    - 신호
    - 네트워크 보안 기초
    - 방화벽
    - TLS
    - 인증서
    - 공개키 기반 구조
    - VPN

  exclude_topics:
    - 운영체제 프로세스
    - 운영체제 스레드
    - CPU 스케줄링
    - 문맥 교환
    - 가상 메모리
    - 페이지 테이블
    - 파일시스템
    - 데드락
    - 세마포어
    - 뮤텍스
    - 데이터베이스 트랜잭션
    - SQL
    - 정규화
    - 인덱스 설계
