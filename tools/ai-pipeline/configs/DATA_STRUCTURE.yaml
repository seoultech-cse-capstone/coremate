subject_code: DATA_STRUCTURE
db_subject_code: DS
subject_name: 자료구조
subject_name_en: Data Structures

taxonomy_rules:
  category_lv1_count: "5~7"
  category_lv2_per_lv1: "2~6"
  concepts_per_lv2: "3~10"

taxonomy_scope:
  scope_summary: "자료구조 과목은 데이터를 저장하고 조직하는 추상 자료형, 선형 자료구조, 트리, 해시, 그래프 표현, 자료구조별 연산 성질과 복잡도를 중심으로 구성한다."

  include_topics:
    - 자료구조 개요
    - 추상 자료형
    - 자료형과 자료구조의 차이
    - 시간 복잡도
    - 공간 복잡도
    - 점근 표기법
    - 최선 평균 최악 경우
    - 배열
    - 동적 배열
    - 인덱스 접근
    - 순차 저장 구조
    - 연결 리스트
    - 단일 연결 리스트
    - 이중 연결 리스트
    - 원형 연결 리스트
    - 노드
    - 포인터 연결
    - 스택
    - LIFO
    - 큐
    - FIFO
    - 원형 큐
    - 덱
    - 우선순위 큐
    - 트리
    - 트리 용어
    - 루트
    - 부모 자식 관계
    - 높이
    - 깊이
    - 차수
    - 이진 트리
    - 포화 이진 트리
    - 완전 이진 트리
    - 균형 트리
    - 이진 탐색 트리
    - AVL 트리
    - 레드 블랙 트리
    - 힙
    - 최소 힙
    - 최대 힙
    - 힙 삽입
    - 힙 삭제
    - 해시 테이블
    - 해시 함수
    - 해시 충돌
    - 체이닝
    - 개방 주소법
    - 선형 조사
    - 이차 조사
    - 이중 해싱
    - 적재율
    - 그래프 기본
    - 정점
    - 간선
    - 방향 그래프
    - 무방향 그래프
    - 가중 그래프
    - 인접 행렬
    - 인접 리스트
    - 그래프 표현
    - 그래프 순회 개념
    - DFS
    - BFS

  exclude_topics:
    - 버블 정렬
    - 선택 정렬
    - 삽입 정렬
    - 병합 정렬
    - 퀵 정렬
    - 힙 정렬
    - 계수 정렬
    - 기수 정렬
    - 버킷 정렬
    - 정렬 안정성
    - 분할 정복
    - 동적 계획법
    - 그리디 알고리즘
    - 백트래킹
    - 최단 경로
    - 다익스트라 알고리즘
    - 벨만-포드 알고리즘
    - 플로이드-워셜 알고리즘
    - 최소 신장 트리
    - 프림 알고리즘
    - 크루스칼 알고리즘
    - 위상 정렬
    - 문자열 매칭 알고리즘
    - KMP 알고리즘
    - 라빈-카프 알고리즘
    - 운영체제 프로세스
    - 운영체제 스레드
    - 가상 메모리
    - 페이지 교체
    - 데이터베이스 트랜잭션
    - SQL
    - 정규화
    - 데이터베이스 인덱스 설계
    - B+트리 인덱스
    - 네트워크 프로토콜
    - TCP
    - UDP
    - IP
    - CPU 파이프라인
    - 캐시 메모리 하드웨어
    - 명령어 집합 구조
    - 논리 게이트
    - 조합 논리 회로
    - 순차 논리 회로
    - Java Collection Framework 사용법
    - Python list 구현 세부 사용법
    - 특정 언어 API 사용법

  overlap_policy: "알고리즘 과목에서 더 중심적으로 다루는 정렬·탐색 알고리즘 설계, 그래프 최단 경로·최소 신장 트리·동적 계획법·그리디는 자료구조 taxonomy에 넣지 않는다. 데이터베이스 과목에서 인덱스 설계 맥락으로 다루는 B+트리와 해시 인덱스, 운영체제 과목의 메모리 관리, 컴퓨터구조 과목의 캐시 하드웨어는 제외한다."

  duplicate_policy: "같은 concept_name 또는 같은 의미의 concept는 taxonomy 전체에서 한 번만 등장시킨다. 선형 구조, 트리, 그래프처럼 여러 장에서 다시 등장하는 기초 개념도 중복 배치하지 않는다."

  concept_granularity_policy: "하위 concept는 자료구조 문제 생성 기준이 될 수 있을 정도로 작아야 하지만, 단순 메서드 이름이나 특정 언어 문법 하나만 과도하게 쪼개는 것은 피한다. 정의, 비교, 오해, 예시, 적용 문제를 만들 수 있는 자료구조 성질과 연산 단위를 우선한다."

concept_rules:
  one_line_definition: "한 문장"
  core_summary: "2~4문장"
  core_keywords: "3~5개"
  key_properties: "3~6개"

  review_status_default: draft
  is_active_default: false
  version_no_default: 1

source_policy:
  raw_pdf_storage: "전공서적 PDF 원문은 data/raw/{SUBJECT_CODE}/에만 로컬 보관하고 GitHub와 서비스 DB에는 저장하지 않는다."
  concept_generation_policy: "PDF 원문을 그대로 복사하지 않고, source_chunks를 근거로 공통 조사 템플릿에 맞게 재구성한다."
  source_refs_policy: "개념과 문제에는 출처 확인용 source_refs 메타데이터를 남긴다."
  insufficient_source_policy: "관련 source_chunks가 부족한 개념은 insufficient_source를 true로 표시하고 사람 검수 대상으로 둔다."

relation_rules:
  allowed_relation_types:
    - related
    - confusing
    - prerequisite

  prerequisite_direction: "source_concept_code는 먼저 알아야 하는 개념, target_concept_code는 이후에 배우는 개념으로 둔다."
  bidirectional_policy: "related와 confusing은 의미상 양방향 관계다. 테스트 JSON에서는 한 방향만 저장할 수 있고, DB 저장 시 양방향 row 저장 또는 조회 시 양방향 검색 방식 중 하나를 선택한다."

common_mistake_rules:
  mistakes_per_concept: "2~4"
  mistake_code_pattern: "{concept_code}_M{index}"
  correction_text_usage: "correction_text는 문제 풀이 중 물음표 힌트 원문으로 재사용한다."
  correction_text_policy: "정답을 직접 알려주기보다, 사용자가 어떤 자료구조 성질이나 연산 차이를 구분해야 하는지 방향을 잡아주는 1~2문장으로 작성한다."

  review_status_default: draft
  is_active_default: false

question_rules:
  question_format: MCQ_4
  questions_per_concept: 2

  choice_key_type: key
  answer_keys:
    - A
    - B
    - C
    - D

  difficulty_levels:
    - 1
    - 2
    - 3
    - 4
    - 5

  difficulty_source_default: ai_initial

  question_types:
    - definition
    - comparison
    - misconception
    - example
    - application

  hint_policy:
    use_hint_mistake_code: true
    hint_field_name: hint_mistake_code
    correction_snapshot_field_name: hint_correction_text_snapshot
    no_hint_value: null

  source_type_default: ai_generated
  review_status_default: draft
  is_active_default: false
  version_no_default: 1

  eligibility_defaults:
    is_daily_quiz_eligible: true
    is_mock_eligible: true
    is_concept_practice_eligible: true

  content_hash:
    enabled: true
    algorithm: sha256
    purpose: "문제 중복 생성 방지"

review_rules:
  ai_review_verdicts:
    - pass
    - revise
    - reject

  human_review_statuses:
    - draft
    - reviewed
    - approved
    - rejected
    - archived

  review_policy: "AI review는 자동 품질 점검 결과일 뿐이며, 사람이 최종 승인하기 전까지 question의 review_status는 draft로 둔다."
