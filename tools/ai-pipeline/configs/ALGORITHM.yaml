subject_code: ALGORITHM
db_subject_code: ALGO
subject_name: 알고리즘
subject_name_en: Algorithms

taxonomy_rules:
  category_lv1_count: "5~7"
  category_lv2_per_lv1: "2~6"
  concepts_per_lv2: "3~10"

taxonomy_scope:
  scope_summary: "알고리즘 과목은 문제 해결 절차의 설계와 분석, 정렬·탐색, 분할 정복, 그리디, 동적 계획법, 그래프 알고리즘, 문자열 알고리즘을 중심으로 구성한다."

  include_topics:
    - 알고리즘 개요
    - 알고리즘 정확성
    - 알고리즘 효율성
    - 시간 복잡도 분석
    - 공간 복잡도 분석
    - 점근 표기법
    - Big-O
    - Big-Omega
    - Big-Theta
    - 최선 평균 최악 경우
    - 재귀 알고리즘
    - 점화식
    - 마스터 정리
    - 완전 탐색
    - 브루트 포스
    - 백트래킹
    - 가지치기
    - 정렬 알고리즘
    - 선택 정렬
    - 삽입 정렬
    - 버블 정렬
    - 병합 정렬
    - 퀵 정렬
    - 힙 정렬
    - 계수 정렬
    - 기수 정렬
    - 버킷 정렬
    - 정렬 안정성
    - 제자리 정렬
    - 탐색 알고리즘
    - 순차 탐색
    - 이진 탐색
    - 결정 문제
    - 분할 정복
    - 그리디 알고리즘
    - 활동 선택 문제
    - 허프만 코딩
    - 동적 계획법
    - 최적 부분 구조
    - 중복 부분 문제
    - 메모이제이션
    - 타뷸레이션
    - 그래프 탐색
    - DFS 알고리즘
    - BFS 알고리즘
    - 위상 정렬
    - 최단 경로
    - 다익스트라 알고리즘
    - 벨만-포드 알고리즘
    - 플로이드-워셜 알고리즘
    - 최소 신장 트리
    - 프림 알고리즘
    - 크루스칼 알고리즘
    - 유니온 파인드
    - 문자열 알고리즘
    - KMP 알고리즘
    - 라빈-카프 알고리즘
    - 트라이 활용
    - NP 문제
    - P와 NP
    - NP-완전

  exclude_topics:
    - 배열 구현
    - 연결 리스트 구현
    - 스택 자료구조 구현
    - 큐 자료구조 구현
    - 해시 테이블 내부 구조
    - 트리 자료구조 용어
    - 이진 탐색 트리 구조
    - AVL 트리 회전 구현
    - 레드 블랙 트리 속성
    - 그래프 인접 행렬 표현 자체
    - 그래프 인접 리스트 표현 자체
    - 운영체제 프로세스
    - 운영체제 스레드
    - CPU 스케줄링 정책
    - 가상 메모리
    - 파일시스템
    - SQL
    - 정규화
    - 데이터베이스 트랜잭션
    - 데이터베이스 인덱스 설계
    - TCP
    - UDP
    - IP
    - HTTP
    - DNS
    - CPU 파이프라인
    - 캐시 메모리 하드웨어
    - 명령어 집합 구조
    - 논리 게이트
    - 조합 논리 회로
    - 특정 프로그래밍 언어 문법
    - 코딩테스트 플랫폼 사용법
    - Spring Boot 구현
    - React 구현
    - Docker
    - AWS 서비스 사용법

  overlap_policy: "자료구조 과목에서 더 중심적으로 다루는 배열·리스트·스택·큐·트리·해시·그래프 표현 자체는 알고리즘 taxonomy에 넣지 않는다. 알고리즘 과목에서는 해당 자료구조를 이용한 문제 해결 절차, 탐색 전략, 최적화 기법, 정확성·복잡도 분석을 중심으로 다룬다."

  duplicate_policy: "같은 concept_name 또는 같은 의미의 concept는 taxonomy 전체에서 한 번만 등장시킨다. DFS와 BFS처럼 자료구조에서도 언급될 수 있는 개념은 알고리즘에서는 순회 절차와 응용 중심으로만 배치한다."

  concept_granularity_policy: "하위 concept는 알고리즘 문제 생성 기준이 될 수 있을 정도로 작아야 하지만, 특정 코드 한 줄이나 언어별 라이브러리 호출만 과도하게 쪼개는 것은 피한다. 정의, 비교, 오해, 예시, 적용 문제를 만들 수 있는 알고리즘 설계 기법과 대표 알고리즘 단위를 우선한다."

concept_rules:
  one_line_definition: "한 문장"
  core_summary: "2~4문장"
  core_keywords: "3~5개"
  key_properties: "3~6개"

  review_status_default: draft
  is_active_default: false
  version_no_default: 1

source_policy:
  raw_pdf_storage: "전공서적 PDF 원문은 data/raw/{SUBJECT_CODE}/에만 로컬 보관하고 GitHub와 서비스 DB에는 저장하지 않는다."
  concept_generation_policy: "PDF 원문을 그대로 복사하지 않고, source_chunks를 근거로 공통 조사 템플릿에 맞게 재구성한다."
  source_refs_policy: "개념과 문제에는 출처 확인용 source_refs 메타데이터를 남긴다."
  insufficient_source_policy: "관련 source_chunks가 부족한 개념은 insufficient_source를 true로 표시하고 사람 검수 대상으로 둔다."

relation_rules:
  allowed_relation_types:
    - related
    - confusing
    - prerequisite

  prerequisite_direction: "source_concept_code는 먼저 알아야 하는 개념, target_concept_code는 이후에 배우는 개념으로 둔다."
  bidirectional_policy: "related와 confusing은 의미상 양방향 관계다. 테스트 JSON에서는 한 방향만 저장할 수 있고, DB 저장 시 양방향 row 저장 또는 조회 시 양방향 검색 방식 중 하나를 선택한다."

common_mistake_rules:
  mistakes_per_concept: "2~4"
  mistake_code_pattern: "{concept_code}_M{index}"
  correction_text_usage: "correction_text는 문제 풀이 중 물음표 힌트 원문으로 재사용한다."
  correction_text_policy: "정답을 직접 알려주기보다, 사용자가 어떤 알고리즘 조건이나 설계 기법 차이를 구분해야 하는지 방향을 잡아주는 1~2문장으로 작성한다."

  review_status_default: draft
  is_active_default: false

question_rules:
  question_format: MCQ_4
  questions_per_concept: 2

  choice_key_type: key
  answer_keys:
    - A
    - B
    - C
    - D

  difficulty_levels:
    - 1
    - 2
    - 3
    - 4
    - 5

  difficulty_source_default: ai_initial

  question_types:
    - definition
    - comparison
    - misconception
    - example
    - application

  hint_policy:
    use_hint_mistake_code: true
    hint_field_name: hint_mistake_code
    correction_snapshot_field_name: hint_correction_text_snapshot
    no_hint_value: null

  source_type_default: ai_generated
  review_status_default: draft
  is_active_default: false
  version_no_default: 1

  eligibility_defaults:
    is_daily_quiz_eligible: true
    is_mock_eligible: true
    is_concept_practice_eligible: true

  content_hash:
    enabled: true
    algorithm: sha256
    purpose: "문제 중복 생성 방지"

review_rules:
  ai_review_verdicts:
    - pass
    - revise
    - reject

  human_review_statuses:
    - draft
    - reviewed
    - approved
    - rejected
    - archived

  review_policy: "AI review는 자동 품질 점검 결과일 뿐이며, 사람이 최종 승인하기 전까지 question의 review_status는 draft로 둔다."

