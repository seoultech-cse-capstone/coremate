name: Deploy to AWS (ECS)

# main 에 머지되면 백엔드·AI 서버 이미지를 빌드해 ECR 에 올리고, ECS 서비스를 새 태스크 정의로 교체한다.
# AWS 는 액세스 키 없이 GitHub OIDC 로 역할을 맡아 접근한다(coremate-dev-github-actions-role —
# 신뢰 정책이 이 레포의 main 브랜치만 허용한다). 배포 구조와 수동 작업은 docs/deploy/aws.md 참고.
on:
  push:
    branches: [main]
    # 모바일·문서만 바뀐 머지는 서버에 영향이 없어 배포하지 않는다.
    paths:
      - 'apps/backend/**'
      - 'tools/ai-pipeline/**'
      - 'infra/aws/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# 배포가 겹치면 늦게 끝난 쪽이 먼저 끝난 쪽을 덮는다. 한 번에 하나씩, 도중에 끊지 않고 차례로 돈다.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::334478199632:role/coremate-dev-github-actions-role
  ECS_CLUSTER: coremate-dev-cluster
  ECS_SERVICE: coremate-dev-backend
  TASK_DEFINITION_FILE: infra/aws/ecs-task-definition.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      # 태그는 커밋 SHA 다. 어떤 커밋이 떠 있는지 ECS 콘솔에서 바로 보이고, 되돌릴 때 그 SHA 로 다시 배포하면 된다.
      # provenance 를 끄는 이유: 켜 두면 이미지마다 증명 매니페스트가 따로 쌓여 ECR 수명 주기(최근 5개 유지)가
      # 실제 이미지를 예상보다 빨리 지운다.
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/coremate-dev-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push AI server image
        uses: docker/build-push-action@v7
        with:
          context: tools/ai-pipeline
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/coremate-dev-ai-server:${{ github.sha }}
          cache-from: type=gha,scope=ai-server
          cache-to: type=gha,mode=max,scope=ai-server

      - id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_FILE }}
          container-name: backend
          image: ${{ steps.ecr.outputs.registry }}/coremate-dev-backend:${{ github.sha }}

      - id: render-ai-server
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          container-name: ai-server
          image: ${{ steps.ecr.outputs.registry }}/coremate-dev-ai-server:${{ github.sha }}

      # 새 태스크가 ALB 헬스 체크를 통과해야 끝난다. 실패하면 ECS 배포 서킷 브레이커가 이전 버전으로 되돌린다.
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ai-server.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 20
