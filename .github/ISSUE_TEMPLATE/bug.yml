name: 버그 리포트
description: 버그나 오류 상황을 등록합니다.
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: 발생 영역
      description: 어디에서 발생한 문제인가요?
      options:
        - Frontend
        - Backend
        - AI Pipeline
        - Infra
        - Database
        - Unknown
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 문제 상황
      description: 어떤 문제가 발생했는지 설명해주세요.
      placeholder: 예) AI 분석 요청 후 결과 화면으로 이동하지 않고 로딩 상태가 유지됩니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 순서를 작성해주세요.
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 동작해야 하나요?
      placeholder: 예) 분석 완료 후 AI 분석 결과 화면으로 이동해야 합니다.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 에러 메시지
      description: 콘솔 로그, 서버 로그, 에러 메시지가 있으면 붙여주세요.
      render: shell

  - type: upload
    id: screenshots
    attributes:
      label: 스크린샷 / 영상
      description: 화면 오류가 있다면 캡처나 영상을 첨부해주세요.