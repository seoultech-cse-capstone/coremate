name: 작업 Task
description: 리팩토링, 세팅, 문서화, 회의 후속 작업 등을 등록합니다.
title: "[TASK] "
labels: ["task"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: 작업 영역
      description: 어느 파트 작업인가요?
      options:
        - Frontend
        - Backend
        - AI Pipeline
        - Infra
        - Docs
        - Common
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 작업 내용
      description: 어떤 작업을 해야 하나요?
      placeholder: 예) GitHub Organization 이전 후 README의 레포 주소를 수정한다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 세부 작업
      description: 해야 할 일을 체크리스트로 작성해주세요.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: 참고 사항
      description: 관련 문서, 회의 내용, 주의할 점이 있으면 작성해주세요.