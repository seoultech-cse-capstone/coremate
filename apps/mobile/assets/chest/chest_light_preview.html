<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>랜덤상자 빛 연출 미리보기</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:18px;background:#1a1430;color:#f3e9d2;
       font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  canvas{border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  button{font-size:18px;padding:12px 28px;border:0;border-radius:10px;cursor:pointer;
          background:#f0b856;color:#3a2416;font-weight:700;box-shadow:0 4px 0 #a8672a}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #a8672a}
  button:disabled{opacity:.6;cursor:default}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  .label{font-variant-numeric:tabular-nums;opacity:.8;font-size:14px;min-width:200px}
  .knobs{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;
          font-size:13px;opacity:.85;width:456px}
  .knobs input{width:100%}
  .hint{font-size:12px;opacity:.55;text-align:center;line-height:1.6;max-width:456px}
</style></head><body>
<canvas id="cv" width="456" height="474"></canvas>
<div class="row">
  <button id="btn">📦 상자 열기</button>
  <button id="reset" style="background:#6c5b93;color:#fff;box-shadow:0 4px 0 #3f3460">다시 닫기</button>
  <span class="label" id="label"></span>
</div>
<div class="knobs">
  <span>빛 세기</span><input id="kInt" type="range" min="0" max="2" step="0.05" value="1"><span id="vInt">1.00</span>
  <span>빛기둥 각도</span><input id="kAng" type="range" min="10" max="60" step="1" value="32"><span id="vAng">32°</span>
  <span>입자 개수</span><input id="kPar" type="range" min="0" max="60" step="1" value="28"><span id="vPar">28</span>
</div>
<div class="hint">빛은 스프라이트와 별개의 캔버스 레이어(additive 블렌드)로 그려집니다.

const SEQ = [{"frame": 0, "name": "closed", "ms": 250}, {"frame": 1, "name": "hop1_a", "ms": 60}, {"frame": 2, "name": "hop1_b", "ms": 60}, {"frame": 3, "name": "hop1_c", "ms": 60}, {"frame": 0, "name": "closed", "ms": 320}, {"frame": 4, "name": "hop2_a", "ms": 60}, {"frame": 5, "name": "hop2_b", "ms": 60}, {"frame": 6, "name": "hop2_c", "ms": 60}, {"frame": 0, "name": "closed", "ms": 320}, {"frame": 7, "name": "hop3_a", "ms": 60}, {"frame": 8, "name": "hop3_b", "ms": 60}, {"frame": 9, "name": "hop3_c", "ms": 60}, {"frame": 0, "name": "closed", "ms": 150}, {"frame": 10, "name": "swing1", "ms": 40}, {"frame": 11, "name": "swing2", "ms": 40}, {"frame": 12, "name": "swing3", "ms": 40}, {"frame": 13, "name": "swing4", "ms": 40}, {"frame": 14, "name": "swing5", "ms": 40}, {"frame": 15, "name": "swing6", "ms": 40}, {"frame": 16, "name": "swing7", "ms": 40}, {"frame": 17, "name": "open", "ms": 1500}];
const S = 6, CW = 456, CH = 474, CHEST_Y = 150;
const OPEN_X = 24 * S, OPEN_Y = CHEST_Y + 30 * S;

// ---------- per-frame light targets ----------
// intensity: 0..1 brightness, openness: 0 closed .. 1 fully open (cone width)
const TARGET = {
  closed:   { i: 0.0,  o: 0.0 },
  hop1_a:   { i: 0.18, o: 0.05 }, hop1_b: { i: 0.30, o: 0.08 }, hop1_c: { i: 0.15, o: 0.05 },
  hop2_a:   { i: 0.40, o: 0.08 }, hop2_b: { i: 0.55, o: 0.12 }, hop2_c: { i: 0.30, o: 0.06 },
  hop3_a:   { i: 0.65, o: 0.12 }, hop3_b: { i: 0.85, o: 0.18 }, hop3_c: { i: 0.55, o: 0.10 },
  swing1:   { i: 0.70, o: 0.20 }, swing2: { i: 0.80, o: 0.35 }, swing3: { i: 0.90, o: 0.50 },
  swing4:   { i: 1.00, o: 0.70 }, swing5: { i: 1.00, o: 0.85 }, swing6: { i: 1.00, o: 0.95 },
  swing7:   { i: 1.00, o: 1.00 },
  open:     { i: 0.75, o: 1.00 },   // settles to a gentle pulse after the flash
};
const RESIDUAL = 0.12;   // light left over between hops (cracks stay lit)
// hop frames: whole-chest jitter (dx,dy) and lid lift in 1x sprite px
const HOP = {"hop1_a": {"dx": 0, "dy": -2, "lift": 1}, "hop1_b": {"dx": 1, "dy": -3, "lift": 2}, "hop1_c": {"dx": 0, "dy": -1, "lift": 1}, "hop2_a": {"dx": -1, "dy": -3, "lift": 2}, "hop2_b": {"dx": 1, "dy": -4, "lift": 3}, "hop2_c": {"dx": 0, "dy": -1, "lift": 1}, "hop3_a": {"dx": -1, "dy": -3, "lift": 3}, "hop3_b": {"dx": 1, "dy": -5, "lift": 4}, "hop3_c": {"dx": 0, "dy": -2, "lift": 2}};
const OX = 20, OY = 20, PW = 27, SX = 3, NSTEP = 7;

// ---------- state ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const imgs = F.map(f => { const im = new Image(); im.src = f.src; return im; });
let frameIdx = 0, playing = false, seqPos = -1, seqT = 0, lastTs = 0;
let inten = 0, open = 0, flash = 0, tGlobal = 0;
let particles = [];
const knob = (id, vid, fmt) => { const el = document.getElementById(id);
  const v = document.getElementById(vid); const f = () => v.textContent = fmt(el.value);
  el.oninput = f; f(); return el; };
const kInt = knob('kInt','vInt', v => (+v).toFixed(2));
const kAng = knob('kAng','vAng', v => v + '°');
const kPar = knob('kPar','vPar', v => v);

function currentName() { return F[frameIdx].name; }
function hopInfo() { return HOP[currentName()] || {dx: 0, dy: 0, lift: 0}; }
function chestOffsetY() { return hopInfo().dy * S; }
// seam (lid/base gap) as canvas polylines: front seam runs along the sweep,
// end-panel seam is horizontal on the right. y sits in the middle of the gap.
function seamPaths() {
  const h = hopInfo(); const gy = 15 - h.lift / 2;
  const P = (x, y) => [ (x + h.dx) * S, CHEST_Y + (y + h.dy) * S ];
  const front = []; for (let t = NSTEP - 1; t >= 0; t--) front.push(P(OX - SX * t + 1, OY - t + gy));
  const end = [ P(OX + 2, OY + gy), P(OX + PW - 2, OY + gy) ];
  return { front, end, gap: h.lift };
}

// ---------- particles ----------
function spawnParticle(strength) {
  const spread = 10 + 60 * open;
  let x = OPEN_X + (Math.random() - .5) * spread * 2;
  let y = OPEN_Y + chestOffsetY() + (Math.random() - .5) * 8;
  if (open < 0.3) {                       // lid still closed: sparks come out of the gap
    const sp = seamPaths(); const pts = Math.random() < 0.6 ? sp.front : sp.end;
    const u = Math.random() * (pts.length - 1), a = Math.floor(u), f = u - a;
    const b = Math.min(a + 1, pts.length - 1);
    x = pts[a][0] + (pts[b][0] - pts[a][0]) * f; y = pts[a][1] + (pts[b][1] - pts[a][1]) * f;
  }
  particles.push({
    x, y,
    vx: (Math.random() - .5) * 0.6 * (0.3 + open),
    vy: -(0.6 + Math.random() * 1.6) * (0.4 + strength),
    life: 1, decay: 0.006 + Math.random() * 0.012,
    size: (Math.random() < .25 ? 3 : 2) * (S / 3),
    coin: open > .6 && Math.random() < .18,
  });
}
function stepParticles(dt) {
  const want = +kPar.value * inten * (0.3 + open);
  if (particles.length < want && Math.random() < 0.5 + inten) spawnParticle(inten);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.004 * dt; p.life -= p.decay * dt; }
  particles = particles.filter(p => p.life > 0 && p.y > -20);
}

// ---------- drawing ----------
function drawBackground() {
  const g = ctx.createRadialGradient(CW/2, CH*0.55, 20, CW/2, CH*0.55, CW*0.9);
  g.addColorStop(0, '#3a2a5e'); g.addColorStop(1, '#170f2a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
}
// light leaking through the lid gap: bright core line + soft halo + short rays
// fanning out above and below the seam (perpendicular to it)
function drawSeamLeak(k) {
  if (k <= 0.001) return;
  const { front, end, gap } = seamPaths();
  const g = 0.5 + gap * 0.35;                      // wider gap -> stronger leak
  const flick = 0.85 + 0.15 * Math.sin(tGlobal / 37) * Math.sin(tGlobal / 61);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  const strokePath = (pts, w, col) => {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke();
  };
  for (const pts of [front, end]) {
    // soft halo (cheap blur: stacked strokes)
    for (const [w, a] of [[16, 0.06], [10, 0.10], [6, 0.16], [3.2, 0.30]])
      strokePath(pts, w * S * g * 0.5, `rgba(255,200,110,${a * k * flick})`);
    // bright core
    strokePath(pts, (0.6 + gap * 0.25) * S, `rgba(255,244,200,${0.9 * k})`);
  }
  // rays: short gradient lines leaving the seam on both sides
  const rays = (pts, nx, ny, count, seed) => {
    for (let i = 0; i < count; i++) {
      const u = (i + 0.5) / count;
      const a = Math.floor(u * (pts.length - 1)), f = u * (pts.length - 1) - a;
      const b = Math.min(a + 1, pts.length - 1);
      const x = pts[a][0] + (pts[b][0] - pts[a][0]) * f, y = pts[a][1] + (pts[b][1] - pts[a][1]) * f;
      const ph = Math.sin(tGlobal / 90 + i * 1.7 + seed) * 0.5 + 0.5;       // shimmer
      const len = (8 + 26 * g * k) * S * (0.45 + 0.55 * ph);
      for (const dir of [1, -1]) {
        const L = len * (dir > 0 ? 1 : 0.7);
        const ex = x + nx * L * dir, ey = y + ny * L * dir;
        const gr = ctx.createLinearGradient(x, y, ex, ey);
        gr.addColorStop(0, `rgba(255,236,170,${0.55 * k * (0.6 + 0.4 * ph)})`);
        gr.addColorStop(1, 'rgba(255,190,90,0)');
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey);
        ctx.lineWidth = (1.2 + 1.4 * ph) * S * 0.5; ctx.strokeStyle = gr; ctx.stroke();
      }
    }
  };
  // front seam direction (SX,1) -> outward normals (-1,SX)/|..| (down-left) and (1,-SX) (up-right)
  const nl = Math.hypot(1, SX);
  rays(front, -1 / nl, SX / nl, 7, 0);
  rays(end, 0, 1, 6, 3);
  ctx.restore();
}

function drawLight() {
  const k = +kInt.value * inten; if (k <= 0.001) return;
  const oy = chestOffsetY();
  // while the lid is still (nearly) closed the light leaks from the gap;
  // the upward cone fades in only as the lid actually swings open
  const coneW = Math.max(0, (open - 0.15) / 0.85); const coneK = k * coneW * coneW;
  if (coneK <= 0.001) return;
  const ax = OPEN_X, ay = OPEN_Y + oy;                  // cone apex (box opening)
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // --- upward light cone (god rays) ---
  const ang = (+kAng.value) * Math.PI / 180;
  const h = CH * (0.35 + 0.75 * open);                  // cone height
  const halfTop = Math.tan(ang) * h * (0.15 + 0.85 * open);
  const halfBase = 6 * S * (0.15 + 0.85 * open);
  for (const [w, a] of [[1.0, 0.55], [0.62, 0.45], [0.30, 0.55]]) {
    ctx.beginPath();
    ctx.moveTo(ax - halfBase * w, ay);
    ctx.lineTo(ax - halfTop * w, ay - h);
    ctx.lineTo(ax + halfTop * w, ay - h);
    ctx.lineTo(ax + halfBase * w, ay);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, ay, 0, ay - h);
    g.addColorStop(0,   `rgba(255,236,170,${a * coneK})`);
    g.addColorStop(0.45,`rgba(255,196,90,${a * 0.55 * coneK})`);
    g.addColorStop(1,   'rgba(255,170,60,0)');
    ctx.fillStyle = g; ctx.fill();
  }
  // --- radial glow at the opening ---
  const r = (14 + 26 * open) * S * (0.8 + 0.2 * Math.sin(tGlobal / 180));
  const rg = ctx.createRadialGradient(ax, ay, 0, ax, ay, r);
  rg.addColorStop(0,   `rgba(255,240,190,${0.75 * coneK})`);
  rg.addColorStop(0.35,`rgba(255,200,100,${0.35 * coneK})`);
  rg.addColorStop(1,   'rgba(255,160,60,0)');
  ctx.fillStyle = rg; ctx.fillRect(ax - r, ay - r, r * 2, r * 2);
  // --- flash on open ---
  if (flash > 0) { ctx.fillStyle = `rgba(255,240,200,${flash * 0.55})`; ctx.fillRect(0, 0, CW, CH); }
  ctx.restore();
}
function drawParticles(behind) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    if ((p.y > OPEN_Y + chestOffsetY()) !== behind) continue;   // lower ones go behind the chest
    ctx.globalAlpha = Math.min(1, p.life * 1.4);
    if (p.coin) {
      ctx.fillStyle = '#f0b856'; ctx.fillRect(Math.round(p.x) - 4, Math.round(p.y) - 3, 8, 6);
      ctx.fillStyle = '#ffe48a'; ctx.fillRect(Math.round(p.x) - 3, Math.round(p.y) - 2, 4, 2);
      ctx.fillStyle = '#c07e34'; ctx.fillRect(Math.round(p.x) - 4, Math.round(p.y) + 2, 8, 1);
    } else {
      ctx.fillStyle = p.life > .5 ? '#ffe48a' : '#f0b856';
      const s = p.size; ctx.fillRect(Math.round(p.x - s/2), Math.round(p.y - s/2), s, s);
    }
  }
  ctx.restore();
}
function drawChest() {
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(imgs[frameIdx], 0, CHEST_Y, 76 * S, 54 * S);
}

// ---------- main loop ----------
function tick(ts) {
  const dt = Math.min(3, (ts - lastTs) / 16.67 || 1); lastTs = ts; tGlobal += dt * 16.67;
  // sequence stepping
  if (playing) {
    seqT += dt * 16.67;
    while (seqPos < SEQ.length && seqT >= SEQ[seqPos].ms) {
      seqT -= SEQ[seqPos].ms; seqPos++;
      if (seqPos >= SEQ.length) { playing = false; seqPos = SEQ.length - 1; break; }
      frameIdx = SEQ[seqPos].frame;
      if (SEQ[seqPos].name === 'open') flash = 1;      // burst when it pops open
    }
  }
  // light easing toward per-frame targets (fast attack, slow decay)
  const name = currentName();
  let t = TARGET[name] || TARGET.closed;
  let ti = t.i, to = t.o;
  if (name === 'closed' && seqPos > 0) ti = Math.max(ti, RESIDUAL * Math.min(1, seqPos / 4));
  if (name === 'open') ti = 0.7 + 0.08 * Math.sin(tGlobal / 260);   // gentle pulse
  inten += (ti - inten) * (ti > inten ? 0.45 : 0.10) * dt;
  open  += (to - open)  * (to > open  ? 0.35 : 0.15) * dt;
  flash = Math.max(0, flash - 0.06 * dt);
  stepParticles(dt);
  // compose
  drawBackground();
  drawLight();                       // upward cone (behind the chest, only once it opens)
  drawParticles(true);
  drawChest();
  // light leaking through the lid gap sits ON the chest surface -> drawn over the sprite
  drawSeamLeak(+kInt.value * inten * Math.pow(1 - Math.min(1, open / 0.6), 1.5));
  drawParticles(false);
  document.getElementById('label').textContent =
    name + '  ·  light ' + inten.toFixed(2) + '  open ' + open.toFixed(2);
  requestAnimationFrame(tick);
}
document.getElementById('btn').onclick = () => {
  if (playing) return; playing = true; seqPos = 0; seqT = 0; frameIdx = SEQ[0].frame;
  document.getElementById('btn').disabled = true;
};
document.getElementById('reset').onclick = () => {
  playing = false; seqPos = -1; frameIdx = 0; inten = 0; open = 0; flash = 0; particles = [];
  document.getElementById('btn').disabled = false;
};
Promise.all(imgs.map(im => new Promise(r => im.onload = r))).then(() => requestAnimationFrame(tick));
</script></body></html>
