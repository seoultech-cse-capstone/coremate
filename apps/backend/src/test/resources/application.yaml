spring:
  datasource:
    url: jdbc:h2:mem:coremate;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  # 마이그레이션은 MySQL 전용 문법(native enum, INSERT ... AS new ON DUPLICATE KEY UPDATE 등)이라
  # H2 에서 돌지 않는다. 테스트 스키마는 위 create-drop 이 엔티티로 만든다.
  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  # 이 파일이 main 의 application.yaml 을 통째로 대체하므로 mail 설정도 여기 있어야 한다.
  # 없으면 JavaMailSender 가 자동 구성되지 않아 MailService 빈 생성이 실패하고
  # @SpringBootTest 컨텍스트가 전부 뜨지 않는다(실제로 메일을 보내지는 않는다).
  mail:
    host: localhost
    port: 25

# 테스트는 실제 FCM 을 호출하지 않는다. 경로를 비워 Firebase 초기화를 건너뛰면
# PushSenderConfig 가 로그 전송기를 고른다. 이 줄이 없어도 키가 없어 같은 결과지만,
# main 에 기본값이 생기면 조용히 실제 발송으로 바뀌므로 명시해 둔다.
firebase:
  credentials-path:
  credentials-json:

jwt:
  secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  access-token-expiry-sec: 3600
  refresh-token-expiry-sec: 604800

# SignupEmailVerificationService 가 @Value 로 직접 읽는 값들. 없으면 플레이스홀더 해석 실패로
# authService -> authController 순으로 빈 생성이 무너져 @SpringBootTest 컨텍스트가 전혀 뜨지 않는다.
# main 과 같은 값을 쓴다.
signup-email:
  code-ttl-sec: 300
  verified-ttl-sec: 1800
  resend-cooldown-sec: 60
  code-length: 6
  max-verify-attempts: 5

# PasswordResetService 가 @Value 로 직접 읽는 값들. 없으면 플레이스홀더 해석 실패로
# @SpringBootTest 컨텍스트가 뜨지 않는다. main 과 같은 값을 쓴다.
password-reset:
  code-ttl-sec: 300
  token-ttl-sec: 600
  resend-cooldown-sec: 60
  code-length: 6
  max-verify-attempts: 5

# SecurityConfig 가 @Value 로 직접 읽는 관리자 웹 CORS 허용 출처. 기본값이 없어 이 값이 없으면
# securityConfig -> authService 순으로 빈 생성이 무너져 @SpringBootTest 컨텍스트가 뜨지 않는다.
# main 과 같은 로컬 값을 쓴다.
admin-web:
  allowed-origins: http://localhost:3000
