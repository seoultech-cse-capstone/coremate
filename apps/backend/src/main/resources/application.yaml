spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/coremate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: coremate
    password: coremate
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-sec: 3600      # 1시간
  refresh-token-expiry-sec: 604800   # 7일

password-reset:
  code-ttl-sec: 300           # 인증번호 유효시간 5분
  token-ttl-sec: 600          # 재설정 토큰 유효시간 10분
  resend-cooldown-sec: 60     # 재발송 쿨다운 60초
  code-length: 6              # 인증번호 자릿수
  max-verify-attempts: 5      # 인증번호 검증 최대 시도 횟수
