spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/coremate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: coremate
    # 호스트에서 직접 실행(bootRun)할 때도 infra/.env 의 값을 그대로 쓰도록 환경변수 참조.
    # (Docker 로 띄우는 백엔드는 compose 가 SPRING_DATASOURCE_PASSWORD 로 주입)
    password: ${MYSQL_PASSWORD:coremate}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션(db/migration)이 만든다. Hibernate 는 엔티티와 테이블이
      # 맞는지만 검사해, 테이블·컬럼이 없거나 타입이 다르면 기동을 멈춘다 — db/migration/README.md 참고.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

firebase:
  # FCM 발송용 서비스 계정 JSON 경로. git 미추적이라 없는 환경이 있을 수 있고,
  # 그 경우 알림만 빠진 채로 기동한다(FirebaseConfig 참고).
  # 기본값은 호스트에서 bootRun 할 때 기준. Docker 는 compose 가 절대경로로 주입한다.
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:secrets/firebase-service-account.json}
  # 서비스 계정 JSON 내용 자체. 파일을 둘 수 없는 배포 환경(ECS)에서 시크릿으로 주입하며,
  # 값이 있으면 credentials-path 보다 우선한다. 로컬은 비워 두고 위 파일 경로를 쓴다.
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

apns:
  # 아이폰 푸시(APNs) 인증 키. 개발자 사이트 「키」에서 APNs 를 켜고 만든 .p8 의 팀 ID·키 ID·파일 내용이다.
  # 개인 키라 시크릿으로만 주입한다. 비어 있으면 아이폰 알림은 보내지 않고 로그만 남긴다(안드로이드는 영향 없음).
  # 팀 ID 는 Sign in with Apple 키와 같은 팀이라 따로 주지 않으면 APPLE_TEAM_ID 를 쓴다.
  team-id: ${APNS_TEAM_ID:${APPLE_TEAM_ID:}}
  key-id: ${APNS_KEY_ID:}
  private-key: ${APNS_PRIVATE_KEY:}
  # 알림을 받을 앱의 번들 ID. 공개값.
  topic: ${APNS_TOPIC:com.coremate.app}
  # TestFlight·App Store 로 설치한 앱은 운영(production) 토큰, Xcode 로 직접 설치한 개발 빌드는 sandbox 토큰을 쓴다.
  # 로컬에서 시뮬레이터·개발 빌드로 시험할 때만 false 로 둔다.
  production: ${APNS_PRODUCTION:true}

oauth:
  google:
    # 구글 로그인 idToken 의 aud(수신자) 검증에 쓰는 웹 클라이언트 ID. 공개값이라 시크릿은 아니다.
    # 프론트 GoogleSignin 의 webClientId 와 같은 값이어야 하며, 없으면 구글 로그인만 실패한다.
    client-id: ${GOOGLE_CLIENT_ID:}
    # 아이폰 앱의 구글 로그인(iOS 클라이언트) ID. 아이폰에서 받은 idToken 은 aud 가 이 값일 수 있어 함께 허용한다.
    # 앱에도 그대로 들어가는 공개값이라 기본값으로 둔다(앱 .env 의 EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID 와 같은 값).
    ios-client-id: ${GOOGLE_IOS_CLIENT_ID:566760156194-o05cfsh71pm1v82n46ikf2racobj8cpj.apps.googleusercontent.com}
  kakao:
    # 탈퇴할 때 카카오 연결을 끊는(연결 끊기 API) 데 쓰는 앱 어드민 키. 카카오 디벨로퍼스 「앱 키」의 어드민 키다.
    # 앱의 모든 회원 정보를 다룰 수 있는 키라 시크릿으로만 주입한다. 비어 있으면 탈퇴는 되고 연결 끊기만 건너뛴다.
    admin-key: ${KAKAO_ADMIN_KEY:}
  apple:
    # 아이폰 앱 번들 ID. Apple identity token 의 aud 검증과, 토큰 교환·해지 요청의 client_id 로 쓴다. 공개값.
    client-id: ${APPLE_CLIENT_ID:com.coremate.app}
    # 탈퇴할 때 Apple 연결을 끊는(토큰 해지) 데 쓰는 Sign in with Apple 키. 개발자 사이트 「키」에서 만든 .p8 의
    # 팀 ID·키 ID·파일 내용이다. 개인 키라 시크릿으로만 주입한다. 비어 있으면 로그인은 되고 연결 끊기만 건너뛴다.
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}

admob:
  # 광고 시청 완료 콜백(서버 측 확인, SSV)으로 코인을 줄 보상형 광고 단위 ID. 쉼표로 구분한다.
  # 공개값이라 시크릿은 아니다(앱에도 그대로 들어간다). "ca-app-pub-…/1234567890" 처럼 통째로 적어도
  # 되고, 콜백에 실려 오는 뒷부분 숫자만 비교한다. 비어 있으면 어떤 콜백에도 코인을 주지 않는다.
  # 기본값은 상점 「상점_광고보상」 광고 단위(안드로이드, iOS)다. 앱 useRewardedAd.ts 의 값과 같아야 한다.
  rewarded-ad-unit-ids: ${ADMOB_REWARDED_AD_UNIT_IDS:ca-app-pub-1897328042001393/9301105018,ca-app-pub-1897328042001393/7246621462}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-sec: 3600      # 1시간
  refresh-token-expiry-sec: 604800   # 7일

admin-web:
  # 관리자 웹(브라우저)에서 API 를 호출할 때만 쓰는 CORS 허용 출처. 콤마로 여러 개.
  # 모바일 앱은 네이티브라 Origin 헤더가 없어 이 설정의 영향을 받지 않는다.
  # 운영 배포 시 Vercel 도메인을 환경변수(ADMIN_WEB_ALLOWED_ORIGINS)로 덮어쓴다.
  allowed-origins: ${ADMIN_WEB_ALLOWED_ORIGINS:http://localhost:3000}

password-reset:
  code-ttl-sec: 300           # 인증번호 유효시간 5분
  token-ttl-sec: 600          # 재설정 토큰 유효시간 10분
  resend-cooldown-sec: 60     # 재발송 쿨다운 60초
  code-length: 6              # 인증번호 자릿수
  max-verify-attempts: 5      # 인증번호 검증 최대 시도 횟수

idempotency:
  # 멱등성 키 보존 기간(일). 매일 자정 스케줄러가 created_at 이 이 기간을 지난 키를 삭제한다.
  # 멱등성 판정에 필요한 건 클라이언트 재시도 윈도우(더블클릭·네트워크 재시도·오프라인 재전송)뿐이라
  # 1일이면 충분하다. 오래 보관할수록 테이블만 커진다.
  retention-days: 1

signup-email:
  code-ttl-sec: 300           # 인증번호 유효시간 5분
  verified-ttl-sec: 1800      # 인증 완료 상태 유효시간 30분(이 안에 회원가입 완료해야 함)
  resend-cooldown-sec: 60     # 재발송 쿨다운 60초
  code-length: 6              # 인증번호 자릿수
  max-verify-attempts: 5      # 인증번호 검증 최대 시도 횟수

weakness:
  analysis:
    # AI 서버(Python ai-pipeline) 주소. 기본값 localhost 는 호스트에서 bootRun 할 때 기준이고,
    # 백엔드가 컨테이너 안에서 돌 때는 그 localhost 가 컨테이너 자신이라 절대 닿지 않는다.
    # Docker 는 compose 가 host.docker.internal 로 덮어쓴다.
    ai-server-base-url: ${WEAKNESS_ANALYSIS_AI_SERVER_BASE_URL:http://localhost:8000}
    # 약점 후보로 채택할 최소 약점 점수.
    #
    # 점수 = 100 * (0.5*오답률 + 0.3*롱타임률 + 0.2*힌트률) 인데, 롱타임은 "맞췄지만 오래 걸린"
    # 문제만 세므로 오답률과 롱타임률이 한 문항에서 동시에 오를 수 없다. 그래서 개념의 문제를
    # 전부 틀려도 50점, 힌트까지 다 써야 70점이 상한이다. 기본값 60 은 사실상 도달하지 못해
    # 실제 풀이로는 후보가 한 번도 잡히지 않았다(20문항·13오답·힌트4 회차에서 최고 58점).
    #
    # 40 이면 "개념 문제의 대부분(80% 이상)을 틀림"이 후보로 잡히고, 절반만 틀린 개념은 걸러진다.
    # 근거 충분도(min-evidence-strength)가 두 번째 관문으로 남아 있어 문항 수가 적은 개념은
    # 점수가 높아도 통과하지 못한다.
    min-weakness-score: 40

# 부하테스트 관측용(이슈 #273). Prometheus 가 /actuator/prometheus 를 긁어 Grafana 로 본다.
# 노출 범위를 health·prometheus·metrics 로 한정한다(운영에서도 과다 노출 방지).
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      # 그래프에서 인스턴스/앱 구분용 공통 태그.
      application: coremate-backend
    distribution:
      # http.server.requests 를 히스토그램으로 내보내 Grafana 에서 p95/p99 를 계산할 수 있게 한다.
      percentiles-histogram:
        http.server.requests: true
